# CI workflow for a uw-slides presentation deck.
#
# Copy this file to <deck>/.github/workflows/deck.yml.
# It requires no secrets and no extra setup beyond a Python 3 runner.
#
# What it does on every push and PR:
#   1. Build   — concatenate fragments into build/index.html (./build.sh)
#   2. Visuals — add pass-2 visuals, build/index-with-visuals.html (./build-visuals.sh)
#   3. Lint    — check fragments, CSS scoping, font sizes, alt text, staleness
#   4. Publish — one file with images and reveal.js inlined (./publish.sh)
#   5. Upload  — attach build/index-published.html as a workflow artifact
#
# reveal.js must be committed (git add assets/reveal/) for step 4 to inline it.
#
# Optional: GitHub Pages
#   Uncomment the Pages steps and permissions below, then enable Pages in repo
#   settings (Source: GitHub Actions). The artifact URL in the Actions summary
#   is also a convenient preview link for pull requests.

name: Deck CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read
  # For GitHub Pages, also uncomment:
  # pages: write
  # id-token: write

jobs:
  build-lint-publish:
    runs-on: ubuntu-latest
    # For GitHub Pages, also uncomment:
    # environment:
    #   name: github-pages

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build (pass 1)
        run: ./build.sh --strict

      - name: Build with visuals (pass 2)
        run: ./build-visuals.sh --strict

      - name: Lint
        run: python3 tools/lint.py .

      - name: Publish (pass 3)
        run: ./publish.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deck
          path: build/index-published.html
          if-no-files-found: error

      # --- Optional: deploy to GitHub Pages ---
      # Uncomment the steps below and the permissions above, then enable Pages
      # in repo settings (Settings → Pages → Source: GitHub Actions). The site
      # is the published file alone, served as index.html; it deploys only
      # from main, not from pull requests.
