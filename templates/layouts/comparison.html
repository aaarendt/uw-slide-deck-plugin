<section data-slide="layout-comparison"
         data-layout="comparison"
         aria-label="Slide 6: Comparison"
         class="slide">

  <div class="layout">
    <h1 data-slot="key-message">Laptop versus cloud</h1>

    <div class="columns">
      <div class="column" data-slot="left">
        <h2>Laptop</h2>
        <ul>
          <li>Fixed capacity</li>
          <li>Free to keep running</li>
          <li>Hard to share</li>
        </ul>
      </div>

      <div class="divider" aria-hidden="true"></div>

      <div class="column" data-slot="right">
        <h2>Cloud</h2>
        <ul>
          <li>Scales to the job</li>
          <li>Billed by the hour</li>
          <li>Shared by default</li>
        </ul>
      </div>
    </div>

    <p class="source" data-slot="source" data-optional>Source: Lab survey, 2026</p>
  </div>

  <style>
    section[data-slide="layout-comparison"] {
      --bg: var(--slide-bg-light);
      --fg: var(--slide-text);
      --fg-muted: var(--slide-text-muted);
      --head: var(--slide-heading);
      background: var(--bg);
      color: var(--fg);
    }

    section[data-slide="layout-comparison"]::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: var(--slide-accent-size);
      background: var(--slide-accent);
    }

    section[data-slide="layout-comparison"] .layout {
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: clamp(2.5rem, 6vw, 6rem) clamp(2rem, 6vw, 7.5rem) clamp(3.5rem, 6vw, 6rem);
    }

    section[data-slide="layout-comparison"] h1 {
      font-family: var(--font-display);
      font-size: clamp(2.25rem, 3.6vw, 3.5rem);
      font-weight: var(--slide-heading-weight);
      line-height: 1.1;
      letter-spacing: -0.01em;
      text-transform: var(--slide-heading-transform);
      color: var(--head);
      margin: 0 0 var(--space-6);
    }

    section[data-slide="layout-comparison"] .columns {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 2px 1fr;
      gap: clamp(2rem, 4vw, 4rem);
      align-items: start;
    }

    section[data-slide="layout-comparison"] .column {
      min-width: 0;
      font-size: clamp(1.5rem, 2.4vw, 2.375rem);
      line-height: 1.4;
    }

    section[data-slide="layout-comparison"] .divider {
      align-self: stretch;
      background: var(--slide-accent);
    }

    section[data-slide="layout-comparison"] h2 {
      font-family: var(--font-display);
      font-size: clamp(1.75rem, 3vw, 2.875rem);
      font-weight: 700;
      line-height: 1.2;
      color: var(--head);
      margin: 0 0 var(--space-3);
    }

    section[data-slide="layout-comparison"] ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    section[data-slide="layout-comparison"] li {
      position: relative;
      padding-left: 1.5em;
      margin: 0 0 var(--space-4);
    }

    section[data-slide="layout-comparison"] li::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0.55em;
      width: 0.6em;
      height: 0.6em;
      border-radius: 50%;
      background: var(--slide-accent);
    }

    section[data-slide="layout-comparison"] .source {
      position: absolute;
      left: clamp(2rem, 6vw, 7.5rem);
      right: clamp(2rem, 6vw, 7.5rem);
      bottom: clamp(1rem, 2.5vw, 2.5rem);
      font-size: clamp(1rem, 1.1vw, 1.25rem);
      line-height: 1.3;
      color: var(--fg-muted);
      margin: 0;
    }
  </style>
</section>
