<section data-slide="layout-closing"
         data-layout="closing"
         aria-label="Slide 12: Closing"
         class="slide">

  <div class="layout">
    <!-- Optional: remove when the brief has no params.logo. src is relative to build/index.html. -->
    <img class="logo" src="../assets/images/logo.png" alt="Institution logo" data-param="logo" data-optional>

    <div class="message">
      <h1 data-slot="key-message">Questions and next steps</h1>
      <p class="action" data-slot="action" data-optional>Launch one VM this week and share what you learn.</p>
    </div>

    <div class="contact" data-slot="contact" data-optional>
      <p>jane.doe@example.edu</p>
      <p>example.edu/cloud-basics</p>
    </div>
  </div>

  <style>
    section[data-slide="layout-closing"] {
      --bg: var(--slide-bg-dark);
      --fg: var(--slide-text-on-dark);
      --fg-muted: var(--slide-text-muted-on-dark);
      --head: var(--slide-text-on-dark);
      background: var(--bg);
      color: var(--fg);
    }

    section[data-slide="layout-closing"]::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: var(--slide-accent-size);
      background: var(--slide-accent);
    }

    section[data-slide="layout-closing"] .layout {
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
      padding: clamp(2.5rem, 6vw, 6rem) clamp(2rem, 6vw, 7.5rem);
      text-align: center;
    }

    /* White version of a dark-on-light logo; drop the filter for a full-colour logo */
    section[data-slide="layout-closing"] .logo {
      height: clamp(5rem, 8vw, 7.5rem);
      max-width: 60%;
      object-fit: contain;
      filter: brightness(0) invert(1);
    }

    section[data-slide="layout-closing"] .message {
      max-width: 60rem;
    }

    section[data-slide="layout-closing"] h1 {
      font-family: var(--font-display);
      font-size: clamp(2.75rem, 4.5vw, 5.375rem);
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: -0.02em;
      text-transform: var(--slide-heading-transform);
      text-wrap: balance;
      color: var(--head);
      margin: 0 0 var(--space-4);
    }

    section[data-slide="layout-closing"] .action {
      font-size: clamp(1.5rem, 2.4vw, 2.5rem);
      line-height: 1.35;
      text-wrap: balance;
      color: var(--fg-muted);
      margin: 0;
    }

    section[data-slide="layout-closing"] .contact {
      font-size: clamp(1.5rem, 1.8vw, 1.75rem);
      line-height: 1.5;
      color: var(--fg);
    }

    section[data-slide="layout-closing"] .contact p {
      margin: 0;
    }
  </style>
</section>
