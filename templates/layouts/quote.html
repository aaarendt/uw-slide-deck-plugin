<section data-slide="layout-quote"
         data-layout="quote"
         aria-label="Slide 8: Quote"
         class="slide">

  <div class="layout">
    <figure>
      <blockquote>
        <h1 data-slot="key-message">“The cloud did not make our science faster. It made waiting optional.”</h1>
      </blockquote>
      <figcaption>
        <span class="who" data-slot="attribution">Dr. Maria Chen</span>
        <span class="role" data-slot="role" data-optional>Director, Genomics Core</span>
      </figcaption>
    </figure>
    <p class="source" data-slot="source" data-optional>Source: Interview, October 2026</p>
  </div>

  <style>
    section[data-slide="layout-quote"] {
      --bg: var(--slide-bg-subtle);
      --fg: var(--slide-text);
      --fg-muted: var(--slide-text-muted);
      --head: var(--slide-heading);
      background: var(--bg);
      color: var(--fg);
    }

    section[data-slide="layout-quote"]::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: var(--slide-accent-size);
      background: var(--slide-accent);
    }

    section[data-slide="layout-quote"] .layout {
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(2.5rem, 6vw, 6rem) clamp(2rem, 8vw, 10rem) clamp(3.5rem, 6vw, 6rem);
    }

    section[data-slide="layout-quote"] figure {
      margin: 0;
      padding-left: clamp(1.5rem, 3vw, 3rem);
      border-left: var(--slide-accent-size) solid var(--slide-accent);
      max-width: 64rem;
    }

    section[data-slide="layout-quote"] blockquote {
      margin: 0;
    }

    section[data-slide="layout-quote"] h1 {
      font-family: var(--font-display);
      font-size: clamp(2rem, 3.8vw, 3.75rem);
      font-weight: 700;
      line-height: 1.2;
      text-wrap: balance;
      color: var(--head);
      margin: 0;
    }

    section[data-slide="layout-quote"] figcaption {
      display: flex;
      flex-direction: column;
      gap: var(--space-1);
      margin-top: var(--space-4);
      font-size: clamp(1.5rem, 2vw, 2rem);
      line-height: 1.3;
    }

    section[data-slide="layout-quote"] .who {
      font-weight: 600;
      color: var(--fg);
    }

    section[data-slide="layout-quote"] .role {
      color: var(--fg-muted);
    }

    section[data-slide="layout-quote"] .source {
      position: absolute;
      left: clamp(2rem, 8vw, 10rem);
      right: clamp(2rem, 8vw, 10rem);
      bottom: clamp(1rem, 2.5vw, 2.5rem);
      font-size: clamp(1rem, 1.1vw, 1.25rem);
      line-height: 1.3;
      color: var(--fg-muted);
      margin: 0;
    }
  </style>
</section>
