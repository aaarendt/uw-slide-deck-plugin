<section data-slide="layout-title"
         data-layout="title"
         aria-label="Slide 1: Title"
         class="slide">

  <div class="layout">
    <!-- Optional: remove when the brief has no params.logo. src is relative to build/index.html. -->
    <img class="logo" src="../assets/images/logo.png" alt="Institution logo" data-param="logo" data-optional>

    <div class="titles">
      <h1 data-slot="key-message">Cloud Basics for Researchers</h1>
      <h2 data-slot="subtitle" data-optional>Run your first analysis in the cloud</h2>
    </div>

    <div class="presenter">
      <p class="name" data-slot="presenter" data-optional>Jane Doe</p>
      <p data-slot="affiliation" data-optional>University of Washington</p>
      <p data-slot="date" data-optional>November 3, 2026</p>
    </div>
  </div>

  <style>
    section[data-slide="layout-title"] {
      --bg: var(--slide-bg-dark);
      --fg: var(--slide-text-on-dark);
      --fg-muted: var(--slide-text-muted-on-dark);
      --head: var(--slide-text-on-dark);
      background: var(--bg);
      color: var(--fg);
    }

    section[data-slide="layout-title"]::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: var(--slide-accent-size);
      background: var(--slide-accent);
    }

    section[data-slide="layout-title"] .layout {
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
      padding: clamp(2.5rem, 6vw, 6rem) clamp(2rem, 6vw, 7.5rem);
      text-align: center;
    }

    /* White version of a dark-on-light logo; drop the filter for a full-colour logo */
    section[data-slide="layout-title"] .logo {
      height: clamp(5rem, 8vw, 7.5rem);
      max-width: 60%;
      object-fit: contain;
      filter: brightness(0) invert(1);
    }

    section[data-slide="layout-title"] .titles {
      max-width: 72rem;
    }

    section[data-slide="layout-title"] h1 {
      font-family: var(--font-display);
      font-size: clamp(2.75rem, 4.5vw, 5.375rem);
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: -0.02em;
      text-transform: var(--slide-heading-transform);
      text-wrap: balance;
      color: var(--head);
      margin: 0 0 var(--space-3);
    }

    section[data-slide="layout-title"] h2 {
      font-family: var(--font-body);
      font-size: clamp(1.5rem, 2.4vw, 2.5rem);
      font-weight: 400;
      line-height: 1.3;
      text-wrap: balance;
      color: var(--fg-muted);
      margin: 0;
    }

    section[data-slide="layout-title"] .presenter {
      font-size: clamp(1.5rem, 1.8vw, 1.75rem);
      line-height: 1.5;
      color: var(--fg-muted);
    }

    section[data-slide="layout-title"] .presenter p {
      margin: 0;
    }

    section[data-slide="layout-title"] .presenter .name {
      font-weight: 600;
      color: var(--fg);
    }
  </style>
</section>
