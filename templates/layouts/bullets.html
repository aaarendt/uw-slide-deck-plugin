<section data-slide="layout-bullets"
         data-layout="bullets"
         aria-label="Slide 4: Bullets"
         class="slide">

  <div class="layout">
    <h1 data-slot="key-message">Three costs to watch</h1>

    <ul data-slot="items">
      <li>Compute hours left running</li>
      <li>Data leaving the region</li>
      <li>Storage nobody cleans up</li>
    </ul>

    <p class="source" data-slot="source" data-optional>Source: Provider pricing pages, 2026</p>
  </div>

  <style>
    section[data-slide="layout-bullets"] {
      --bg: var(--slide-bg-light);
      --fg: var(--slide-text);
      --fg-muted: var(--slide-text-muted);
      --head: var(--slide-heading);
      background: var(--bg);
      color: var(--fg);
    }

    section[data-slide="layout-bullets"]::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: var(--slide-accent-size);
      background: var(--slide-accent);
    }

    section[data-slide="layout-bullets"] .layout {
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: clamp(2.5rem, 6vw, 6rem) clamp(2rem, 6vw, 7.5rem) clamp(3.5rem, 6vw, 6rem);
    }

    section[data-slide="layout-bullets"] h1 {
      font-family: var(--font-display);
      font-size: clamp(2.25rem, 3.6vw, 3.5rem);
      font-weight: var(--slide-heading-weight);
      line-height: 1.1;
      letter-spacing: -0.01em;
      text-transform: var(--slide-heading-transform);
      color: var(--head);
      margin: 0 0 var(--space-6);
    }

    section[data-slide="layout-bullets"] ul {
      list-style: none;
      max-width: 64rem;
      margin: 0;
      padding: 0;
    }

    section[data-slide="layout-bullets"] li {
      position: relative;
      font-size: clamp(1.5rem, 2.8vw, 2.75rem);
      line-height: 1.35;
      padding-left: 1.5em;
      margin: 0 0 var(--space-4);
    }

    section[data-slide="layout-bullets"] li::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0.55em;
      width: 0.6em;
      height: 0.6em;
      border-radius: 50%;
      background: var(--slide-accent);
    }

    section[data-slide="layout-bullets"] .source {
      position: absolute;
      left: clamp(2rem, 6vw, 7.5rem);
      right: clamp(2rem, 6vw, 7.5rem);
      bottom: clamp(1rem, 2.5vw, 2.5rem);
      font-size: clamp(1rem, 1.1vw, 1.25rem);
      line-height: 1.3;
      color: var(--fg-muted);
      margin: 0;
    }
  </style>
</section>
