<!-- UW Transition / Section Divider Slide Template
     Use between major sections of a deck to signal a new topic.
     Visually bold — full purple background, large section number or label.

     Variables:
       slide_number   — display number (e.g. "7")
       section_number — prominent section counter shown large (e.g. "02", "Part 2")
       section_label  — small all-caps label above the title (e.g. "Section Two")
       title          — primary text for the transition (e.g. "Data Pipeline")
       subtitle       — optional secondary line beneath the title
       theme          — "purple" (default) or "gold" or "dark"
-->
<section data-label="{{ slide_number }} {{ title }}"
         aria-label="Slide {{ slide_number }}: Section transition — {{ title }}"
         class="slide-transition theme-{{ theme | default('purple') }}">

  <!-- Gold accent bar — always top for transition slides -->
  <div class="accent-bar top"></div>

  <!-- Optional large section number (decorative) -->
  {% if section_number %}
  <div class="section-number" aria-hidden="true">{{ section_number }}</div>
  {% endif %}

  <div class="transition-content">
    {% if section_label %}
    <p class="section-label">{{ section_label }}</p>
    {% endif %}
    <h2 class="transition-title">{{ title }}</h2>
    {% if subtitle %}
    <p class="transition-subtitle">{{ subtitle }}</p>
    {% endif %}
  </div>

  <!-- Gold rule at bottom -->
  <div class="bottom-rule" aria-hidden="true"></div>

  <style>
    section.slide-transition {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      padding: var(--space-8);
      position: relative;
      overflow: hidden;
    }

    /* ── Themes ── */
    section.slide-transition.theme-purple {
      background: var(--uw-spirit-purple);
      color: var(--uw-white);
    }
    section.slide-transition.theme-dark {
      background: var(--uw-husky-purple);
      color: var(--uw-white);
    }
    section.slide-transition.theme-gold {
      background: var(--uw-spirit-gold);
      color: var(--uw-husky-purple);
    }

    /* ── Accent bar ── */
    section.slide-transition .accent-bar {
      position: absolute;
      background: var(--uw-spirit-gold);
    }
    section.slide-transition.theme-gold .accent-bar {
      background: var(--uw-husky-purple);
    }
    section.slide-transition .accent-bar.top {
      top: 0; left: 0; right: 0;
      height: 8px;
    }

    /* ── Decorative section number ── */
    section.slide-transition .section-number {
      position: absolute;
      right: var(--space-8);
      font-family: 'Encode Sans', sans-serif;
      font-weight: 900;
      font-size: 320px;
      line-height: 1;
      opacity: 0.08;
      user-select: none;
      pointer-events: none;
      color: currentColor;
    }

    /* ── Transition content ── */
    section.slide-transition .transition-content {
      position: relative;
      z-index: 1;
      max-width: 1200px;
    }

    section.slide-transition .section-label {
      font-family: 'Open Sans', sans-serif;
      font-weight: 600;
      font-size: 28px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin: 0 0 var(--space-4) 0;
    }
    section.slide-transition.theme-purple .section-label,
    section.slide-transition.theme-dark   .section-label { color: var(--uw-spirit-gold); }
    section.slide-transition.theme-gold   .section-label { color: var(--uw-heritage-gold); }

    section.slide-transition .transition-title {
      font-family: 'Encode Sans', sans-serif;
      font-weight: 900;
      font-size: 96px;
      line-height: 1.05;
      margin: 0;
      text-transform: uppercase;
    }

    section.slide-transition .transition-subtitle {
      font-family: 'Open Sans', sans-serif;
      font-weight: 300;
      font-size: 36px;
      margin: var(--space-4) 0 0 0;
      line-height: 1.4;
    }
    section.slide-transition.theme-purple .transition-subtitle,
    section.slide-transition.theme-dark   .transition-subtitle { color: var(--uw-husky-gold-web); }

    /* ── Bottom rule ── */
    section.slide-transition .bottom-rule {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 4px;
      background: var(--uw-spirit-gold);
      opacity: 0.4;
    }
    section.slide-transition.theme-gold .bottom-rule {
      background: var(--uw-husky-purple);
    }
  </style>
</section>
