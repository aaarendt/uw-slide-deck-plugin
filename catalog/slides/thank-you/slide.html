<section data-slide="thank-you"
         data-layout="catalog"
         data-catalog="thank-you@1.0.0"
         aria-label="{{aria-label}}"
         class="slide">

  <div class="layout">
    <div class="message">
      <h1>{{message}}</h1>
      <p class="action">{{action}}</p>
    </div>

    <div class="contact">
      <p class="presenter">{{presenter}}</p>
      <p class="email"><a href="mailto:{{email}}">{{email}}</a></p>
      <p class="url"><a href="{{url}}">{{url}}</a></p>
    </div>
  </div>

  <style>
    section[data-slide="thank-you"] {
      --bg: var(--slide-bg-dark);
      --fg: var(--slide-text-on-dark);
      --fg-muted: var(--slide-text-muted-on-dark);
      --accent: var(--slide-accent);
      background: var(--bg);
      color: var(--fg);
      position: relative;
    }

    section[data-slide="thank-you"]::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: var(--slide-accent-size);
      background: var(--accent);
    }

    section[data-slide="thank-you"] .layout {
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: clamp(2.5rem, 6vw, 6rem) clamp(2rem, 6vw, 7.5rem);
      gap: var(--space-4);
      text-align: center;
    }

    section[data-slide="thank-you"] .message {
      max-width: 60rem;
    }

    section[data-slide="thank-you"] h1 {
      font-family: var(--font-display);
      font-size: clamp(2.75rem, 4.5vw, 5.375rem);
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: -0.02em;
      text-transform: var(--slide-heading-transform);
      text-wrap: balance;
      color: var(--fg);
      margin: 0 0 var(--space-4);
    }

    section[data-slide="thank-you"] .action {
      font-size: clamp(1.5rem, 2.4vw, 2.5rem);
      line-height: 1.35;
      text-wrap: balance;
      color: var(--fg-muted);
      margin: 0;
    }

    section[data-slide="thank-you"] .action:empty {
      display: none;
    }

    section[data-slide="thank-you"] .contact {
      font-size: clamp(1.5rem, 1.8vw, 1.75rem);
      line-height: 1.5;
      color: var(--fg);
    }

    section[data-slide="thank-you"] .contact p {
      margin: 0;
    }

    section[data-slide="thank-you"] .contact .presenter {
      font-weight: 600;
    }

    section[data-slide="thank-you"] .contact a {
      color: var(--fg-muted);
      text-decoration: underline;
      text-underline-offset: 0.15em;
    }

    section[data-slide="thank-you"] .contact .presenter:empty,
    section[data-slide="thank-you"] .contact .email:empty,
    section[data-slide="thank-you"] .contact .url:empty,
    section[data-slide="thank-you"] .contact .email:has(a:empty),
    section[data-slide="thank-you"] .contact .email:has(a[href="mailto:"]),
    section[data-slide="thank-you"] .contact .url:has(a[href=""]) {
      display: none;
    }
  </style>
</section>
