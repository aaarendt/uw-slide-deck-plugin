<section data-slide="uw-title"
         data-layout="catalog"
         data-catalog="uw-title@1.0.0"
         aria-label="{{aria-label}}"
         class="slide">

  <div class="layout">
    <div class="titles">
      <h1>{{title}}</h1>
      <p class="subtitle">{{subtitle}}</p>
    </div>

    <div class="presenter">
      <p class="name">{{presenter}}</p>
      <p class="affiliation">{{affiliation}}</p>
      <p class="date">{{date}}</p>
    </div>
  </div>

  <style>
    section[data-slide="uw-title"] {
      --bg: var(--slide-bg-dark);
      --fg: var(--slide-text-on-dark);
      --fg-muted: var(--slide-text-muted-on-dark);
      background: var(--bg);
      color: var(--fg);
      position: relative;
    }

    section[data-slide="uw-title"]::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: var(--slide-accent-size);
      background: var(--slide-accent);
    }

    section[data-slide="uw-title"] .layout {
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
      padding: clamp(2.5rem, 6vw, 6rem) clamp(2rem, 6vw, 7.5rem);
      text-align: center;
    }

    section[data-slide="uw-title"] .titles {
      max-width: 72rem;
    }

    section[data-slide="uw-title"] h1 {
      font-family: var(--font-display);
      font-size: clamp(2.75rem, 4.5vw, 5.375rem);
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: -0.02em;
      text-transform: var(--slide-heading-transform);
      text-wrap: balance;
      color: var(--fg);
      margin: 0 0 var(--space-3);
    }

    section[data-slide="uw-title"] .subtitle {
      font-family: var(--font-body);
      font-size: clamp(1.5rem, 2.4vw, 2.5rem);
      font-weight: 400;
      line-height: 1.3;
      text-wrap: balance;
      color: var(--fg-muted);
      margin: 0;
    }

    section[data-slide="uw-title"] .subtitle:empty {
      display: none;
    }

    section[data-slide="uw-title"] .presenter {
      font-size: clamp(1.5rem, 1.8vw, 1.75rem);
      line-height: 1.5;
      color: var(--fg-muted);
    }

    section[data-slide="uw-title"] .presenter p {
      margin: 0;
    }

    section[data-slide="uw-title"] .presenter .name {
      font-weight: 600;
      color: var(--fg);
    }

    section[data-slide="uw-title"] .presenter .name:empty,
    section[data-slide="uw-title"] .presenter .affiliation:empty,
    section[data-slide="uw-title"] .presenter .date:empty {
      display: none;
    }
  </style>
</section>
