<section data-slide="agenda"
         data-layout="catalog"
         data-catalog="agenda@1.0.0"
         aria-label="{{aria-label}}"
         class="slide">

  <div class="layout">
    <h1>{{heading}}</h1>
    <ol class="agenda-list">
      {{agenda_items}}
    </ol>
  </div>

  <style>
    section[data-slide="agenda"] {
      --bg: var(--slide-bg-light);
      --fg: var(--slide-text-on-light);
      --fg-muted: var(--slide-text-muted-on-light);
      --accent: var(--slide-accent);
      background: var(--bg);
      color: var(--fg);
      position: relative;
    }

    section[data-slide="agenda"]::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: var(--slide-accent-size);
      background: var(--accent);
    }

    section[data-slide="agenda"] .layout {
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(2.5rem, 6vw, 6rem) clamp(2rem, 8vw, 10rem);
      gap: var(--space-5);
    }

    section[data-slide="agenda"] h1 {
      font-family: var(--font-display);
      font-size: clamp(2.25rem, 3.5vw, 4rem);
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -0.01em;
      text-transform: var(--slide-heading-transform);
      color: var(--fg);
      margin: 0;
    }

    section[data-slide="agenda"] .agenda-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
    }

    section[data-slide="agenda"] .agenda-list li {
      font-family: var(--font-body);
      font-size: clamp(1.5rem, 2vw, 2rem);
      font-weight: 400;
      line-height: 1.3;
      color: var(--fg);
      display: flex;
      align-items: baseline;
      gap: var(--space-2);
    }

    section[data-slide="agenda"] .agenda-list li::before {
      content: "";
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
      transform: translateY(-0.15em);
    }

    section[data-slide="agenda"] .agenda-list .duration {
      font-size: clamp(1rem, 1.3vw, 1.375rem);
      color: var(--fg-muted);
      margin-left: auto;
      white-space: nowrap;
    }
  </style>
</section>
