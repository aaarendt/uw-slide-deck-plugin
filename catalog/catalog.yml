# UW Slides Catalog — index of vetted, reusable slides.
# Format: references/slide-schema.md §2 (restricted YAML subset).
# Each slide's param defaults and full metadata live in slides/<id>/slide.md.
# Curation rules: catalog/CURATION.md

version: "1.0.0"

# Brief descriptions used by plan-deck when choosing catalog slides.
# Full metadata is in slides/<id>/slide.md.
uw-title: "Standard UW branded title slide — presenter, title, subtitle, date, affiliation"
land-ack: "Land acknowledgement placeholder — requires approved text from UW"
funding: "Funding credit slide — agency, grant ID, grant title (placeholder wording)"
agenda: "Auto-generated agenda built from the deck.yml slide titles"
feedback: "Session feedback slide — configurable URL for survey or QR code"
thank-you: "Closing thank-you slide with presenter name and contact info"
cb-eligibility: "CloudBank eligibility (who can lead a project) and recommended uses (good fit vs. better elsewhere)"
cb-what-is: "What CloudBank is: who runs it, which clouds, the 2025 NSF award and the NAIRR link"
cb-programs: "CloudBank's six standard services: no cost, helpdesk, accounts, multiple clouds, monitoring, training"
cb-why-choose: "Why a researcher would choose a CloudBank account: no card, one bill, spending cap, grant dollars"
cb-award-tiers: "CloudBank grant award tiers (Explore, Discover, Accelerate): dollar ranges, averages, who each fits"
cb-process: "CloudBank onboarding process in five steps, from cost estimate to using the clouds, in under a week"

# Ordered list of slide IDs included in this catalog.
slides:
  - uw-title
  - land-ack
  - funding
  - agenda
  - feedback
  - thank-you
  - cb-eligibility
  - cb-what-is
  - cb-programs
  - cb-why-choose
  - cb-award-tiers
  - cb-process
