<!-- UW Comparison Slide Template
     Use for before/after, option A vs B, or pros/cons layouts.

     Variables:
       slide_number     — display number (e.g. "5")
       title            — slide heading
       eyebrow          — optional small label above title
       left_label       — label for left panel (e.g. "Before", "Option A", "Pros")
       left_content     — HTML content for left panel
       left_theme       — "purple" (default) or "gold" or "white"
       right_label      — label for right panel (e.g. "After", "Option B", "Cons")
       right_content    — HTML content for right panel
       right_theme      — "white" (default) or "purple" or "gold"
       divider_label    — optional text on the center divider (e.g. "vs")
       accent_bar       — "top" (default) or "left"
-->
<section data-label="{{ slide_number }} {{ title }}"
         aria-label="Slide {{ slide_number }}: {{ title }}"
         class="slide-comparison">

  <div class="accent-bar {{ accent_bar | default('top') }}"></div>

  <!-- Header (sits above both panels) -->
  <div class="slide-header">
    {% if eyebrow %}
    <p class="eyebrow">{{ eyebrow }}</p>
    {% endif %}
    <h2>{{ title }}</h2>
  </div>

  <!-- Comparison panels -->
  <div class="comparison-panels" role="list">
    <!-- Left panel -->
    <div class="panel panel-left panel-{{ left_theme | default('purple') }}"
         role="listitem"
         aria-label="{{ left_label }}">
      <div class="panel-label" aria-hidden="true">{{ left_label }}</div>
      <div class="panel-content">{{ left_content }}</div>
    </div>

    <!-- Divider -->
    <div class="panel-divider" aria-hidden="true">
      {% if divider_label %}
      <span class="divider-label">{{ divider_label }}</span>
      {% endif %}
    </div>

    <!-- Right panel -->
    <div class="panel panel-right panel-{{ right_theme | default('white') }}"
         role="listitem"
         aria-label="{{ right_label }}">
      <div class="panel-label" aria-hidden="true">{{ right_label }}</div>
      <div class="panel-content">{{ right_content }}</div>
    </div>
  </div>

  <style>
    section.slide-comparison {
      display: flex;
      flex-direction: column;
      background: var(--bg-surface);
      padding: 0;
      position: relative;
      overflow: hidden;
    }

    /* ── Accent bar ── */
    section.slide-comparison .accent-bar {
      position: absolute;
      background: var(--uw-spirit-gold);
      z-index: 2;
    }
    section.slide-comparison .accent-bar.top {
      top: 0; left: 0; right: 0;
      height: 8px;
    }
    section.slide-comparison .accent-bar.left {
      top: 0; left: 0; bottom: 0;
      width: 8px;
    }

    /* ── Header ── */
    section.slide-comparison .slide-header {
      padding: var(--space-6) var(--space-8) var(--space-4);
      flex-shrink: 0;
    }

    section.slide-comparison .eyebrow {
      font-family: 'Open Sans', sans-serif;
      font-weight: 600;
      font-size: 24px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--uw-spirit-purple);
      margin: 0 0 var(--space-3) 0;
    }

    section.slide-comparison h2 {
      font-family: 'Encode Sans', sans-serif;
      font-weight: 800;
      font-size: 52px;
      line-height: 1.1;
      color: var(--uw-spirit-purple);
      margin: 0;
    }

    /* ── Panels ── */
    section.slide-comparison .comparison-panels {
      display: flex;
      flex: 1;
      min-height: 0;
      margin: 0 var(--space-8) var(--space-6);
      gap: 0;
      border-radius: 8px;
      overflow: hidden;
    }

    section.slide-comparison .panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: var(--space-6);
      gap: var(--space-4);
    }

    /* Panel themes */
    section.slide-comparison .panel-purple {
      background: var(--uw-spirit-purple);
      color: var(--uw-white);
    }
    section.slide-comparison .panel-gold {
      background: var(--uw-spirit-gold);
      color: var(--uw-husky-purple);
    }
    section.slide-comparison .panel-white {
      background: var(--uw-white);
      color: var(--text-body);
      border: 2px solid var(--uw-gray-10);
    }

    section.slide-comparison .panel-label {
      font-family: 'Encode Sans', sans-serif;
      font-weight: 800;
      font-size: 28px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding-bottom: var(--space-3);
      border-bottom: 3px solid currentColor;
      opacity: 0.85;
    }

    section.slide-comparison .panel-content {
      font-family: 'Open Sans', sans-serif;
      font-size: 26px;
      line-height: 1.5;
      flex: 1;
    }
    section.slide-comparison .panel-content ul,
    section.slide-comparison .panel-content ol {
      padding-left: 1.3em;
      margin: 0;
    }
    section.slide-comparison .panel-content li {
      margin-bottom: 0.5em;
    }

    /* ── Center divider ── */
    section.slide-comparison .panel-divider {
      width: 6px;
      background: var(--uw-spirit-gold);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      position: relative;
    }

    section.slide-comparison .divider-label {
      font-family: 'Encode Sans', sans-serif;
      font-weight: 900;
      font-size: 28px;
      color: var(--uw-husky-purple);
      background: var(--uw-spirit-gold);
      padding: 8px 14px;
      border-radius: 50%;
      white-space: nowrap;
      position: absolute;
      z-index: 3;
    }
  </style>
</section>
