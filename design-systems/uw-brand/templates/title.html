<!-- UW Title Slide Template -->
<section data-label="{{ slide_number }} {{ title }}" aria-label="Slide {{ slide_number }}: {{ title }}">
  <div class="accent-bar {{ accent_bar }}"></div>

  <div class="title-slide-content">
    <!-- Logos (top) -->
    <div class="logo-strip-top">
      <img src="assets/W-Logo_Purple_RGB.png" alt="University of Washington W logo" class="logo-uw-mark">
    </div>

    <!-- Title and metadata (center) -->
    <div class="title-main">
      {% if eyebrow %}
      <p class="eyebrow">{{ eyebrow }}</p>
      {% endif %}
      <h1>{{ title }}</h1>
      {% if presenter %}
      <p class="presenter">{{ presenter }}</p>
      {% endif %}
    </div>

    <!-- Partner logos (bottom) -->
    {% if partner_logos %}
    <div class="logo-strip-bottom">
      {% for logo in partner_logos %}
      <img src="assets/{{ logo.filename }}" alt="{{ logo.alt }}" class="logo-partner">
      {% endfor %}
    </div>
    {% endif %}
  </div>

  <style>
    section[data-label="{{ slide_number }} {{ title }}"] {
      background: var(--uw-spirit-purple);
      color: var(--uw-white);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-8);
      position: relative;
    }

    .accent-bar {
      position: absolute;
      background: var(--uw-spirit-gold);
    }
    .accent-bar.top {
      top: 0; left: 0; right: 0;
      height: 8px;
    }

    .logo-uw-mark {
      height: 120px;
      filter: brightness(0) invert(1);
    }

    h1 {
      font-family: 'Encode Sans', sans-serif;
      font-weight: 900;
      font-size: 72px;
      line-height: 1.1;
      margin: 0;
      text-transform: uppercase;
    }

    .presenter {
      font-family: 'Open Sans', sans-serif;
      font-size: 32px;
      color: var(--uw-husky-gold-web);
      margin-top: var(--space-4);
    }
  </style>
</section>
